<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative">

  <div *ngIf="showSuccessPopup" class="fixed inset-0 z-[9999] flex items-center justify-center bg-gray-900/50 backdrop-blur-sm transition-opacity">
    
    <div class="bg-white rounded-2xl p-8 shadow-2xl flex flex-col items-center transform transition-all duration-300 scale-100">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-4">
        <i class="ti ti-check text-4xl text-green-600"></i>
      </div>
      <h3 class="text-xl font-bold text-gray-900 mb-1">User Saved Successfully!</h3>
      <p class="text-sm text-gray-500">Redirecting you back to the dashboard...</p>
    </div>

  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <img src="/assets/logo.png" alt="AgriServe Logo" class="h-20 w-auto drop-shadow-sm">
    </div>
    <h2 class="text-center text-2xl font-bold text-gray-900 tracking-tight">Register New User</h2>
    <p class="mt-2 text-center text-sm text-gray-600">Add a new member to the AgriServe platform.</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-xl">
    <div class="bg-white py-8 px-4 shadow-sm border border-gray-200 sm:rounded-xl sm:px-10">
      
      <div *ngIf="errorMessage" class="mb-6 p-4 rounded-md bg-red-50 border border-red-200 flex items-start">
        <i class="ti ti-alert-circle text-red-500 mt-0.5 mr-3 text-lg"></i>
        <p class="text-sm text-red-700 font-medium">{{ errorMessage }}</p>
      </div>

      <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
          
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
            <input type="text" formControlName="name" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 text-sm" placeholder="e.g. John Doe">
            <p *ngIf="f['name'].touched && f['name'].errors?.['required']" class="mt-1 text-xs text-red-500">Name is required.</p>
          </div>

          <div class="sm:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address <span class="text-red-500">*</span></label>
            <input type="email" formControlName="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 text-sm" placeholder="john@example.com">
            <p *ngIf="f['email'].touched && f['email'].errors?.['required']" class="mt-1 text-xs text-red-500">Email is required.</p>
            <p *ngIf="f['email'].touched && f['email'].errors?.['email']" class="mt-1 text-xs text-red-500">Must be a valid email format.</p>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Temporary Password <span class="text-red-500">*</span></label>
            <input type="password" formControlName="password" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 text-sm" placeholder="••••••••">
            <p *ngIf="f['password'].touched && f['password'].errors?.['required']" class="mt-1 text-xs text-red-500">Password is required.</p>
            <p *ngIf="f['password'].touched && f['password'].errors?.['minlength']" class="mt-1 text-xs text-red-500">Must be at least 6 characters.</p>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
            <input type="text" formControlName="phone" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 text-sm" placeholder="Optional">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">System Role <span class="text-red-500">*</span></label>
            <select formControlName="role" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 text-sm bg-white">
              <option value="" disabled selected>Select a role...</option>
              <option value="Admin">Admin</option>
              <option value="Farmer">Farmer</option>
              <option value="ExtensionOfficer">Extension Officer</option>
              <option value="ProgramManager">Program Manager</option>
              <option value="ComplianceOfficer">Compliance Officer</option>
              <option value="Auditor">Auditor</option>
            </select>
            <p *ngIf="f['role'].touched && f['role'].errors?.['required']" class="mt-1 text-xs text-red-500">Role is required.</p>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Account Status <span class="text-red-500">*</span></label>
            <select formControlName="status" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-green-500 focus:border-green-500 text-sm bg-white">
              <option value="ACTIVE">Active</option>
              <option value="INACTIVE">Inactive</option>
              <option value="SUSPENDED">Suspended</option>
            </select>
          </div>

        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
          <button type="button" (click)="cancel()" [disabled]="isSubmitting"
                  class="px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50">
            Cancel
          </button>
          
          <button type="submit" [disabled]="userForm.invalid || isSubmitting"
                  class="inline-flex justify-center items-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors">
            
            <i *ngIf="isSubmitting" class="ti ti-loader-2 animate-spin mr-2 text-lg"></i>
            {{ isSubmitting ? 'Saving...' : 'Create User' }}
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
