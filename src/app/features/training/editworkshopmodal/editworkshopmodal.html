<div class="flex h-screen bg-slate-50 overflow-hidden text-slate-900 font-sans">
  
  <app-sidebar></app-sidebar>

  <div class="flex-1 flex flex-col overflow-hidden">
    
    <app-header></app-header>

    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50/50">
      </main>
  </div>

  <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-fade-in">
    <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden animate-fade-in-up border border-slate-200">

      <div class="flex items-center justify-between p-6 pb-4 border-b border-slate-100">
        <div>
          <h2 class="text-xl font-bold text-slate-900">Edit Workshop</h2>
          <p class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-widest">Workshop ID #{{ workshop.workshopId }}</p>
        </div>
        <button class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" (click)="onCancel()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="p-6 space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
            Workshop Title <span class="text-red-500">*</span>
          </label>
          <input type="text" [(ngModel)]="formData.title"
                 class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow"
                 minlength="3" maxlength="150" placeholder="e.g., Soil Testing Basics">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
            Location / Village <span class="text-red-500">*</span>
          </label>
          <input type="text" [(ngModel)]="formData.location"
                 class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow"
                 placeholder="e.g., North Block Community Center">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
              Date &amp; Time <span class="text-red-500">*</span>
            </label>
            <input type="datetime-local" [(ngModel)]="formData.date"
                   class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
              Assign Officer <span class="text-red-500">*</span>
            </label>
            <select [(ngModel)]="formData.officerId"
                    class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow cursor-pointer">
              <option [ngValue]="0" disabled>Select officer…</option>
              @for (o of availableOfficers; track o.id) {
                <option [ngValue]="o.id">{{ o.name }}</option>
              }
            </select>
          </div>
        </div>
      </div>

      <div class="p-5 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
        <button class="px-5 py-2.5 bg-white border border-slate-300 text-slate-700 rounded-lg text-sm font-bold hover:bg-slate-50 transition-colors shadow-sm" 
                (click)="onCancel()">
          Cancel
        </button>
        <button class="px-5 py-2.5 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700 transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed transform active:scale-95"
                (click)="onSubmit()" [disabled]="!isFormValid">
          Save Changes
        </button>
      </div>

    </div>
  </div>
</div>
