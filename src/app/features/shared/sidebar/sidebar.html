<aside class="hidden md:flex w-64 h-full bg-slate-900 flex-col transition-all duration-300 relative border-r border-slate-800">
  
  <div class="absolute inset-0 bg-green-900/20 pointer-events-none"></div>
  
  <div class="h-20 flex items-center px-6 relative z-10 border-b border-slate-800/50">
    <div class="flex items-center gap-3 cursor-pointer" routerLink="/">
        <img src="/assets/logo.png" alt="AgriServe Logo" class="h-20 w-auto drop-shadow-sm">
    </div>
  </div>

  <div class="flex-1 px-4 py-6 space-y-1 overflow-y-auto relative z-10">
    <p class="px-2 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">Menu</p>
    
    <a *ngFor="let item of filteredMenu" 
       [routerLink]="item.route"
       routerLinkActive="bg-green-800/40 text-green-400 border-green-700/30 group-active"
       [routerLinkActiveOptions]="{exact: false}"
       class="flex items-center gap-3 px-3 py-2.5 text-gray-300 hover:bg-slate-800 hover:text-white rounded-lg group transition-colors border border-transparent">
      
      <div [innerHTML]="item.iconSvg" 
           class="w-5 h-5 flex items-center justify-center text-gray-400 group-hover:text-gray-300 [&>svg]:w-5 [&>svg]:h-5 transition-colors">
      </div>
      
      <span class="font-medium">{{ item.label }}</span>
    </a>
  </div>

  <div class="p-4 border-t border-slate-700/50 relative z-10 bg-slate-900/50">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-sm font-bold text-white border border-slate-600 shadow-inner">
        {{ userInitials }}
      </div>
      <div>
        <p class="text-sm font-semibold text-white">{{userName}}</p> 
        <p class="text-xs text-green-400 font-medium">{{ userDisplayRole }}</p>
      </div>
      
      </div>
  </div>
</aside>
