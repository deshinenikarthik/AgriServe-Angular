<div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
    <div class="mb-4">
        <button (click)="goBack()" class="group flex items-center gap-2 text-sm font-semibold text-gray-500 hover:text-green-600 transition-colors">
        <svg class="w-5 h-5 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Go Back
        </button>
    </div>
  
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    
    <div class="h-40 bg-gradient-to-r from-green-500 to-emerald-600"></div>

    <div class="px-8 pb-8">
      
      <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between -mt-16 sm:-mt-16">
        
        <div class="flex flex-col sm:flex-row items-center sm:items-end gap-6">
          <div class="w-32 h-32 rounded-full border-4 border-white bg-green-50 flex items-center justify-center text-4xl font-bold text-green-700 shadow-md">
            {{ getInitials() }}
          </div>
          
          <div class="text-center sm:text-left mb-2">
            <h1 class="text-3xl font-extrabold text-gray-900">{{ userData.name }}</h1>
            
            <span class="inline-flex mt-2 items-center px-3 py-1 rounded-full text-sm font-semibold bg-green-100 text-green-800 border border-green-200">
              {{ formatRole(userData.role) }}
            </span>
          </div>
        </div>

        <div class="mt-6 sm:mt-0 flex gap-3 justify-center sm:justify-end mb-2">
          <button class="px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
            Change Password
          </button>
          <button class="px-4 py-2 bg-green-600 rounded-lg shadow-sm text-sm font-medium text-white hover:bg-green-700 transition-colors">
            Edit Profile
          </button>
        </div>
      </div>

      <hr class="my-8 border-gray-200">

      <div>
        <h3 class="text-lg font-bold text-gray-900 mb-6">Personal Information</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          
          <div class="bg-gray-50 rounded-xl p-5 border border-gray-100">
            <div class="flex items-center gap-3 mb-2">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
              </svg>
              <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Email Address</p>
            </div>
            <p class="text-lg font-semibold text-gray-900 ml-8">{{ userData.email }}</p>
          </div>

          <div class="bg-gray-50 rounded-xl p-5 border border-gray-100">
            <div class="flex items-center gap-3 mb-2">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
              </svg>
              <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Contact Number</p>
            </div>
            <p class="text-lg font-semibold text-gray-900 ml-8">{{ userData.contactInfo }}</p>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
