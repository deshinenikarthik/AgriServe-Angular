<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-100">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">ID</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Title</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Start Date</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">End Date</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Status</th>
          <th class="px-6 py-4 text-center text-xs font-bold text-gray-500 uppercase">Action</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let prog of programs" class="hover:bg-gray-50/50 transition-colors">
          <td class="px-6 py-4 text-sm font-bold text-gray-900">#TP-{{ prog.programId }}</td>
          <td class="px-6 py-4 text-sm text-gray-700 font-medium">{{ prog.title }}</td>
          <td class="px-6 py-4 text-sm text-gray-500">{{ prog.startDate | date:'mediumDate' }}</td>
          <td class="px-6 py-4 text-sm text-gray-500">{{ prog.endDate | date:'mediumDate' }}</td>
          <td class="px-6 py-4">
            <span class="px-2.5 py-1 text-xs font-semibold rounded-full border" [ngClass]="getStatusClass(prog.status)">
              {{ prog.status }}
            </span>
          </td>
          <td class="px-6 py-4 text-center">
            <button 
            (click)="fillRecord(prog.programId)"
            class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-4 py-2 rounded-lg text-sm font-semibold transition-colors">
              Fill Record
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
