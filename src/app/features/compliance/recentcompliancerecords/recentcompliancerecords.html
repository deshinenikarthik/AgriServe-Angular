<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
  <div class="px-6 py-5 border-b border-gray-200 flex justify-between items-center">
    <h2 class="text-lg font-bold text-gray-900">Recent Compliance Records</h2>
    <a routerLink="/compliance/records" class="text-sm font-semibold text-green-600 hover:text-green-800 transition-colors">
      View All &rarr;
    </a>
  </div>

  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50/50">
        <tr>
          <!-- Changed 'text-left' to 'text-center' on all headers -->
          <th class="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Record ID</th>
          <th class="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Entity ID</th>
          <th class="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Type</th>
          <th class="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Result</th>
          <th class="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Officer</th>
          <th class="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Date</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        
        <tr *ngFor="let record of records" class="hover:bg-gray-50 transition-colors">
          
          <!-- Added 'text-center' to standard text cells -->
          <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900 text-center">
            #REC-{{ record.complianceId }}
          </td>
          
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">
            Entity #{{ record.entityId }}
          </td>

          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 font-medium text-center">
            {{ formatType(record.type) }}
          </td>

          <!-- Added 'flex justify-center' so the status badge centers properly -->
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex justify-center">
              <span class="px-2.5 py-1 inline-flex text-xs leading-5 font-semibold rounded-full border"
                    [ngClass]="getResultClass(record.result)">
                {{ record.result }}
              </span>
            </div>
          </td>

          <!-- Added 'justify-center' for the avatar and name -->
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 flex items-center justify-center gap-2">
            <div class="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold text-gray-600">
              {{ record.officerName.charAt(0) }}
            </div>
            {{ record.officerName }}
          </td>

          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">
            {{ record.date | date:'mediumDate' }}
          </td>
        </tr>

      </tbody>
    </table>
  </div>
</div>
