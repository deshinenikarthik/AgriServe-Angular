<div class="flex h-screen bg-white font-sans text-gray-900 overflow-hidden">
  
  <app-sidebar></app-sidebar>

  <div class="flex-1 flex flex-col overflow-hidden relative">
    
    <!-- Header -->
    <app-header></app-header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-8">
      
      <!-- Page Titles -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Compliance Records</h1>
        <p class="mt-2 text-base text-gray-500">Manage and track compliance for training programs and advisory sessions.</p>
      </div>

      <!-- Tab Navigation -->
      <div class="border-b border-gray-200 mb-8">
        <nav class="-mb-px flex space-x-8">
          <button (click)="switchTab('training')" 
                  [ngClass]="activeTab === 'training' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                  class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm transition-colors">
            Training Programs
          </button>
          
          <button (click)="switchTab('advisory')" 
                  [ngClass]="activeTab === 'advisory' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                  class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm transition-colors">
            Advisory Sessions
          </button>

          <button (click)="switchTab('all')" 
                  [ngClass]="activeTab === 'all' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                  class="whitespace-nowrap pb-4 px-1 border-b-2 font-medium text-sm transition-colors">
            All Compliance Records
          </button>
        </nav>
      </div>

      <!-- Dynamic Tab Rendering Area -->
      <div class="mx-auto max-w-7xl">
        <app-trainingprograms *ngIf="activeTab === 'training'"></app-trainingprograms>
        <app-advisorysessions *ngIf="activeTab === 'advisory'"></app-advisorysessions>
        <app-allcompliancerecords *ngIf="activeTab === 'all'"></app-allcompliancerecords>
      </div>

    </main>
  </div>
</div>
