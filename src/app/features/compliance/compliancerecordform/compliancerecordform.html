<div class="min-h-screen bg-gray-50/50 p-8 flex justify-center">
  <div class="w-full max-w-2xl">
    
    <div class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">New Compliance Record</h1>
        <p class="mt-2 text-sm text-gray-500">Submit findings for the selected entity.</p>
      </div>
      <button (click)="goBack()" class="text-gray-500 hover:text-gray-800 font-medium text-sm flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        Back
      </button>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <form [formGroup]="recordForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Entity ID</label>
            <input type="text" formControlName="entityId" 
                   class="w-full px-4 py-2.5 bg-gray-100 border border-gray-200 rounded-lg text-gray-500 cursor-not-allowed">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Compliance Type</label>
            <input type="text" formControlName="type" 
                   class="w-full px-4 py-2.5 bg-gray-100 border border-gray-200 rounded-lg text-gray-500 cursor-not-allowed">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Result <span class="text-red-500">*</span></label>
          <select formControlName="result" 
                  class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            <option value="" disabled selected>Select an outcome...</option>
            <option value="Compliant">Compliant</option>
            <option value="Non-Compliant">Non-Compliant</option>
            <option value="Requires Attention">Requires Attention</option>
          </select>
          <p *ngIf="recordForm.get('result')?.invalid && recordForm.get('result')?.touched" class="text-red-500 text-xs mt-1">
            Compliance result is required.
          </p>
        </div>

        <div>
          <div class="flex justify-between">
            <label class="block text-sm font-bold text-gray-700 mb-1">Notes <span class="text-red-500">*</span></label>
            <span class="text-xs text-gray-400">{{ recordForm.get('notes')?.value?.length || 0 }} / 500</span>
          </div>
          <textarea formControlName="notes" rows="4" placeholder="Enter detailed findings here..."
                    class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
          
          <div *ngIf="recordForm.get('notes')?.invalid && recordForm.get('notes')?.touched">
            <p *ngIf="recordForm.get('notes')?.errors?.['required']" class="text-red-500 text-xs mt-1">Notes are required.</p>
            <p *ngIf="recordForm.get('notes')?.errors?.['maxlength']" class="text-red-500 text-xs mt-1">Notes cannot exceed 500 characters.</p>
          </div>
        </div>

        <div class="pt-4 border-t border-gray-100 flex justify-end">
          <button type="submit" [disabled]="isSubmitting"
                  class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg text-sm font-bold transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
            <span *ngIf="isSubmitting" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            {{ isSubmitting ? 'Saving...' : 'Save Record' }}
          </button>
        </div>

      </form>
    </div>
  </div>

  <div *ngIf="toastMessage" class="fixed bottom-8 right-8 z-[100] animate-slide-up">
  <div class="flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl border-l-4"
       [ngClass]="{
         'bg-white border-green-500 shadow-green-100': toastType === 'success',
         'bg-white border-red-500 shadow-red-100': toastType === 'error'
       }">
    <i class="ti text-xl" 
       [ngClass]="toastType === 'success' ? 'ti-circle-check text-green-500' : 'ti-alert-circle text-red-500'"></i>
    <span class="text-sm font-bold text-slate-800">{{ toastMessage }}</span>
  </div>
</div>
</div>
